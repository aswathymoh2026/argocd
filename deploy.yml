apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: zomato
  name: zomato-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      labels:
        app: zomato
    spec:
      containers:
      - name: cont1
        image: aswathy2026/zomato_new:44f5dbdbf854f9e3da9278b1ff87e988e43919e9
        ports:
          - containerPort: 3000


